# Bluetooth proxy (advertisements only) with BLE 5.0 Long Range / Coded PHY reception on ESP32-C3.
# Identical to a regular ESPHome Bluetooth proxy configuration plus the `ble_longrange_scanner:` block.
# Copy secrets.yaml.example to secrets.yaml and fill in your WiFi credentials.
substitutions:
  name: bluetooth-proxy-lr
  friendly_name: Bluetooth Proxy LR

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.1.0

external_components:
  - source: github://inteltryb93/esphome_ble_longrange
    components: [ble_longrange_scanner]

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: false

# Replaces the tracker's legacy (BT 4.2) scan with one extended scan on LE 1M + LE Coded PHY (Long Range),
# so thermometers with pvvx "BT5 PHY + LE Long Range" reach Home Assistant like any other BLE device.
ble_longrange_scanner:
  scan_parameters:
    interval: 400ms       # LE 1M: tiny window keeps legacy devices visible at almost no cost to Coded reception
    window: 20ms
    coded_interval: 400ms # LE Coded: window = (almost) interval – measured optimum (docs/test_report.md §8e)
    coded_window: 380ms
    phy: both             # "coded" = Long Range only (legacy devices then invisible), same Coded reception
